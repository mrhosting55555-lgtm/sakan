      let apartments = [...staticApartments];

      let currentTypeFilter = "all";
      let currentPriceFilter = "all";
      let selectedApt = null;

      function toggleTheme() {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const themeBtn = document.querySelector(".theme-toggle");
        if (currentTheme === "dark") {
          document.documentElement.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
          themeBtn.textContent = "🌙";
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
          localStorage.setItem("theme", "dark");
          themeBtn.textContent = "☀️";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
        document.querySelector(".theme-toggle").textContent =
          savedTheme === "dark" ? "☀️" : "🌙";

        loadApartments();
      });

      function togglePriceFilter() {
        const options = document.getElementById("priceOptions");
        const arrow = document.getElementById("arrow");
        options.classList.toggle("hide");
        arrow.style.transform = options.classList.contains("hide")
          ? "rotate(0deg)"
          : "rotate(180deg)";
      }

      function setPriceFilter(val) {
        currentPriceFilter = val;
        document.getElementById("priceOptions").classList.add("hide");
        document.getElementById("arrow").style.transform = "rotate(0deg)";
        render();
      }

      function filterApartments(type) {
        currentTypeFilter = type;
        render();
      }

      function render() {
        const searchVal = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const app = document.getElementById("app");
        app.innerHTML = "";

        const filtered = apartments.filter((apt) => {
          const aptName = (apt.name || "").toLowerCase();
          const aptLocation = (apt.location || "").toLowerCase();

          const matchesSearch =
            aptName.includes(searchVal) || aptLocation.includes(searchVal);
          const matchesType =
            currentTypeFilter === "all" || apt.type === currentTypeFilter;

          let matchesPrice = true;
          if (currentPriceFilter !== "all") {
            const numPrice = parseInt(apt.price);
            const limit = parseInt(currentPriceFilter);
            matchesPrice = !isNaN(numPrice) && numPrice <= limit;
          }

          return matchesSearch && matchesType && matchesPrice;
        });

        if (filtered.length === 0) {
          app.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 3rem; font-weight: 700; opacity: 0.7;">عذراً، لا توجد شقق مطابقة لبحثك.</p>`;
          return;
        }

        filtered.forEach((apt) => {
          const card = document.createElement("div");
          card.className = "apartment-card";

          let mediaHTML = "";
          if (apt.images && apt.images.length > 0) {
            mediaHTML = `
              <div class="apartment-media">
                  <iframe src="${apt.images[0]}" allowfullscreen></iframe>
              </div>`;
          }

          const contentDiv = document.createElement("div");
          contentDiv.className = "apartment-content";

          const titleDiv = document.createElement("div");
          titleDiv.className = "apartment-title";
          titleDiv.innerHTML = apt.name;

          const footerDiv = document.createElement("div");
          footerDiv.className = "apartment-footer";

          const priceSpan = document.createElement("span");
          priceSpan.className = "apartment-price";
          priceSpan.textContent = apt.price
            ? apt.price + " جنيه"
            : "السعر عند الاتصال";

          const bookBtn = document.createElement("button");
          bookBtn.className = "book-btn";
          bookBtn.textContent = "احجز الآن";
          bookBtn.addEventListener("click", () => openModal(apt.name));

          footerDiv.appendChild(priceSpan);
          footerDiv.appendChild(bookBtn);

          contentDiv.appendChild(titleDiv);
          contentDiv.appendChild(footerDiv);

          if (mediaHTML) {
            card.innerHTML = mediaHTML;
          }
          card.appendChild(contentDiv);
          app.appendChild(card);
        });
      }

      async function loadApartments() {
        render(); // يعرض الشقق الثابتة فورًا

        try {
          const res = await fetch(
            "https://sakan-sigma.vercel.app/api/apartments",
          );
          if (!res.ok) throw new Error("Failed to fetch apartments");
          const data = await res.json();

          const formattedApartments = data.map((apt) => ({
            name:
              apt.description +
              (apt.status === "محجوزة"
                ? " <span class='corner-ribbon reserved'>محجوزة</span>"
                : ""),
            location: apt.location,
            price: apt.price,
            type: apt.type,
            images: apt.images || [],
            videoUrl: apt.videoUrl || "",
          }));

          apartments = [...staticApartments, ...formattedApartments];

          render();
        } catch (err) {
          console.error(err);
        }
      }

      function openModal(aptName) {
        selectedApt = aptName;
        document.getElementById("apt-details-text").innerText =
          "الشقة المطلوبة: " + aptName;
        document.getElementById("bookingModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("bookingModal").style.display = "none";
      }

      async function submitBooking(event) {
        event.preventDefault();
        const name = document.getElementById("studentName").value;
        const phone = document.getElementById("studentPhone").value;

        try {
          await fetch("/api/bookings", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              userName: name,
              phone: phone,
              apartmentDetails: selectedApt,
            }),
          });
        } catch (err) {
          console.error("Error saving booking:", err);
        }

        // إزالة وسوم الـ HTML عند إرسال النص للواتساب للحفاظ على نظافة الرسالة
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = selectedApt;
        const plainAptName = tempDiv.textContent || tempDiv.innerText || "";

        const message = `مرحباً، أريد تأكيد حجز الشقة التالية:\n- الشقة: ${plainAptName}\n- الاسم: ${name}\n- رقم التليفون: ${phone}`;
        const whatsappUrl = `https://wa.me/${OWNER_PHONE}?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, "_blank");
        closeModal();
      }

      window.addEventListener("click", function (event) {
        const modal = document.getElementById("bookingModal");
        if (event.target === modal) {
          closeModal();
        }
      });
