<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>شقق جامعة اللوتس</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <header>
      <div class="logo">
        <h1>جامعة اللوتس</h1>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <!-- البحث -->
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="🔍ابحث عن شقة ..."
        onkeyup="render()"
      />
    </div>

    <!-- الفلتر -->
    <div class="filter-buttons">
      <button onclick="filterApartments('all')">🏠 الكل</button>
      <button onclick="filterApartments('girls')">👩 بنات</button>
      <button onclick="filterApartments('boys')">👨 شباب</button>
    </div>

    <!-- الشقق -->
    <div class="container" id="app"></div>

    <script>
      let apartments = [
        {
          name: "شقة في الدور الرابع , عماره اهالي و بنات",
          location: "القرنفل",
          price: "",
          type: "girls",
          images: [
            "https://res.cloudinary.com/dxqtdpjp0/video/upload/v1782034275/%D8%A7%D9%84%D8%B4%D9%82%D9%82/%D8%B9%D9%85%D8%A7%D9%8A%D8%B1%20%D8%A7%D9%84%D9%82%D8%B1%D9%86%D9%81%D9%84/%D8%B9%D9%85%D8%A7%D8%B1%D9%87%202/vid_nkdjna.mp4",
          ],
        },
      ];
    </script>
    <script src="main.js"></script>
    <script src="dark.js"></script>
  </body>
</html>
