<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>شقق جامعة اللوتس</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <header>
      <div class="logo">
        <h1>جامعة اللوتس</h1>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <!-- البحث -->
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="🔍 ابحث عن شقة أو منطقة..."
        onkeyup="render()"
      />
    </div>

    <!-- الفلتر -->
    <div class="filter-buttons">
      <button onclick="filterApartments('all')">🏠 الكل</button>
      <button onclick="filterApartments('girls')">👩 بنات</button>
      <button onclick="filterApartments('boys')">👨 شباب</button>
    </div>

    <!-- الشقق -->
    <div class="container" id="app"></div>

    <script>
      let apartments = [
        {
          name: "شقة دور اول جمب المول",
          location: "سكن مصر",
          price: "",
          type: "boys",
          images: [
            "https://res.cloudinary.com/dxqtdpjp0/video/upload/v1782034267/%D8%A7%D9%84%D8%B4%D9%82%D9%82/%D8%B3%D9%83%D9%86%20%D9%85%D8%B5%D8%B1/%D8%B4%D9%82%D8%A9%20%D8%AF%D9%88%D8%B1%20%D8%A3%D9%88%D9%84%20%D8%AC%D9%86%D8%A8%20%D8%A7%D9%84%D9%85%D9%88%D9%84/vid_kjw5aa.mp4",
          ],
        },

        {
          name: "شقة في دور خامس العماره كلها أهالي، فيها ديب فريزر ونت أرضي وهيتركب لها مراوح سقف.",
          location: "سكن مصر",
          price: "900",
          type: "girls",
          images: [
            "https://res.cloudinary.com/dxqtdpjp0/video/upload/v1782034268/%D8%A7%D9%84%D8%B4%D9%82%D9%82/%D8%B3%D9%83%D9%86%20%D9%85%D8%B5%D8%B1/%D8%B4%D9%82%D9%87%20%D8%AF%D9%88%D8%B1%20%D8%AE%D8%A7%D9%85%D8%B3%20%D8%B9%D9%85%D8%A7%D8%B1%D9%87%20%D8%A7%D9%87%D8%A7%D9%84%D9%8A/WhatsApp_Video_2026-06-15_at_7.53.41_PM_1_rap7kq.mp4",
          ],
        },
      ];
    </script>
    <!-- شباك الحجز (Modal) -->
    <div id="bookingModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 style="margin-bottom: 15px; color: #00e5ff">تأكيد الحجز 🏠</h2>
        <p
          id="apt-details-text"
          style="margin-bottom: 20px; font-size: 14px; color: #ddd"
        ></p>

        <form id="bookingForm" onsubmit="submitBooking(event)">
          <div class="form-group" style="margin-bottom: 15px">
            <input
              type="text"
              id="studentName"
              placeholder="الاسم ثلاثي"
              required
              class="modal-input"
            />
          </div>
          <div class="form-group" style="margin-bottom: 20px">
            <input
              type="tel"
              id="studentPhone"
              placeholder="رقم التليفون (واتساب)"
              required
              class="modal-input"
            />
          </div>
          <button type="submit" class="confirm-btn">تأكيد وإرسال الطلب</button>
        </form>
      </div>
    </div>
    <script src="main.js"></script>
    <script src="dark.js"></script>
  </body>
</html>
