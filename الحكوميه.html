            onclick="openFullImg(this)"
            style="cursor: zoom-in"
          />
          <div class="custom-media-content"></div>
        </div>

    </div>

    <!-- الشقق -->

            "https://res.cloudinary.com/dxqtdpjp0/image/upload/v1782034264/%D8%A7%D9%84%D8%B4%D9%82%D9%82/%D9%85%D9%86%D8%B7%D9%82%D8%A9%20%D8%A7%D9%84%D8%AD%D9%83%D9%88%D9%85%D9%8A%D8%A9/148/2_fezx7b.jpg",

        {

          ],
        },
      ];

       function filterApartments(type) {
        currentFilter = type;
        render();
      }

      function render() {
        const app = document.getElementById("app");
        app.innerHTML = "";

        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();

        apartments
          .filter(
            (apt) =>
              (currentFilter === "all" || apt.type === currentFilter) &&
              (apt.name.toLowerCase().includes(search) ||
                apt.location.toLowerCase().includes(search)),
          )
          .forEach((apt) => {
            const card = document.createElement("div");
            card.className = "card";

            // فحص وجود شريط محجوزة داخل النص لنقله إلى هيكل الكارت الرئيسي تلافيًا لمشاكل الـ Overflow
            let ribbonHTML = "";
            if (apt.name.includes("corner-ribbon")) {
              if (apt.name.includes("reserved"))
                ribbonHTML = `<span class="corner-ribbon reserved">محجوزة</span>`;
              else
                ribbonHTML = `<span class="corner-ribbon available">متاحة</span>`;
            }

            card.innerHTML = `
            ${ribbonHTML}
            <div class="slider">
              ${apt.images
                .map((file, i) => {
                  const isActive = i === 0 ? "active" : "";

                  if (file.includes("drive.google.com/file/d/")) {
                    const embedUrl = file.replace(
                      "/view?usp=drive_link",
                      "/preview",
                    );
                    return `<iframe class="slider-item ${isActive}" src="${embedUrl}" allow="autoplay" allowfullscreen></iframe>`;
                  }

                  if (file.endsWith(".mp4")) {
                    return `
                      <video class="slider-item ${isActive}" controls>
                        <source src="${file}" type="video/mp4">
                        متصفحك لا يدعم تشغيل الفيديو.
                      </video>
                    `;
                  }

                  return `<img src="${file}" class="slider-item ${isActive}">`;
                })
                .join("")}

              <div class="nav">
                <button onclick="prev(this)">❮</button>
                <button onclick="next(this)">❯</button>
              </div>
            </div>

            <div class="card-content">
              <div class="title">${apt.name.replace(/<span[^>]*>([^<]*)<\/span>/g, "")}</div>
              <div class="action-btn">
                <div class="price-btn">${apt.price || "اتصل لمعرفة السعر"}</div>
                <div class="book-btn" onclick="bookNow('${apt.name.replace(/'/g, "\\'")}', '${apt.location}', '${apt.price}')">احجز</div>
              </div>
            </div>
          `;

            app.appendChild(card);
          });
      }

      // دالة التنقل الموحدة والآمنة لجميع أنواع عناصر الميديا
      function next(btn) {
        let slider = btn.closest(".slider");
        let items = slider.querySelectorAll(".slider-item");
        if (items.length <= 1) return;

        let index = [...items].findIndex((el) =>
          el.classList.contains("active"),
        );
        items[index].classList.remove("active");
        items[(index + 1) % items.length].classList.add("active");
      }

      function prev(btn) {
        let slider = btn.closest(".slider");
        let items = slider.querySelectorAll(".slider-item");
        if (items.length <= 1) return;

        let index = [...items].findIndex((el) =>
          el.classList.contains("active"),
        );
        items[index].classList.remove("active");
        items[(index - 1 + items.length) % items.length].classList.add(
          "active",
        );
      }

      function bookNow(name, location, price) {
        let phone = "201152638852";
        let cleanName = name.replace(/<span[^>]*>([^<]*)<\/span>/g, "").trim();
        let message = `عايز احجز:\n\n${cleanName}\n\nالموقع: ${location}\nالسعر: ${price || "اتصل لمعرفة السعر"}`;
        let url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        window.open(url, "_blank");
      }

      function openFullImg(element) {
        const fullImgBox = document.getElementById("fullImgBox");
        const fullImg = document.getElementById("fullImg");
        fullImg.src = element.src;
        fullImgBox.style.display = "flex";
      }

      function closeFullImg() {
        document.getElementById("fullImgBox").style.display = "none";
      }

      // تشغيل أول رندر عند تحميل الصفحة
      render();
    </script>

</html>
