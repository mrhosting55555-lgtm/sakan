      /* --- Root Variables & Theme Setup --- */
      :root {
        --bg-color: #f8fafc;
        --text-color: #1e293b;
        --card-bg: rgba(255, 255, 255, 0.75);
        --nav-bg: rgba(255, 255, 255, 0.85);
        --glass-border: rgba(255, 255, 255, 0.4);
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --accent-color: #f59e0b;
        --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      [data-theme="dark"] {
        --bg-color: #0f172a;
        --text-color: #f1f5f9;
        --card-bg: rgba(30, 41, 59, 0.7);
        --nav-bg: rgba(15, 23, 42, 0.85);
        --glass-border: rgba(255, 255, 255, 0.08);
        --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Cairo", sans-serif;
        text-decoration: none;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        min-height: 100vh;
        transition:
          background-color 0.4s ease,
          color 0.4s ease;
        padding-bottom: 3rem;
      }

      /* --- Animated Background Blobs --- */
      .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
        filter: blur(80px);
        opacity: 0.4;
      }

      .blob {
        position: absolute;
        border-radius: 50%;
        will-change: transform;
        animation: floatBlobs 20s infinite alternate;
      }

      .blob-1 {
        width: 400px;
        height: 400px;
        background: #3b82f6;
        top: -100px;
        right: -100px;
      }
      .blob-2 {
        width: 500px;
        height: 500px;
        background: #ec4899;
        bottom: -150px;
        left: -150px;
        animation-delay: -5s;
      }

      @keyframes floatBlobs {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(50px, 80px) scale(1.1);
        }
      }

      /* --- Header --- */
      header {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 5%;
        background: var(--nav-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--glass-border);
        z-index: 1000;
        box-shadow: var(--shadow);
      }

      .logo h1 {
        font-size: 1.4rem;
        font-weight: 900;
        color: var(--text-color);
      }

      .theme-toggle {
        background: transparent;
        border: 1px solid var(--glass-border);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: var(--transition);
        font-size: 1.1rem;
      }

      .theme-toggle:hover {
        background: var(--primary-color);
        border-color: var(--primary-color);
      }

      /* --- Search & Filters --- */
      .search-box {
        max-width: 600px;
        margin: 2rem auto 1rem auto;
        padding: 0 1.5rem;
      }

      .search-box input {
        width: 100%;
        padding: 0.9rem 1.2rem;
        border-radius: 14px;
        border: 1px solid var(--glass-border);
        background: var(--card-bg);
        backdrop-filter: blur(8px);
        color: var(--text-color);
        font-size: 1rem;
        outline: none;
        box-shadow: var(--shadow);
        transition: var(--transition);
      }

      .search-box input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
      }

      /* Price Filter Dropdown */
      .price-filter {
        max-width: 600px;
        margin: 0 auto 1rem auto;
        padding: 0 1.5rem;
        position: relative;
      }

      .price-header {
        background: var(--card-bg);
        backdrop-filter: blur(8px);
        border: 1px solid var(--glass-border);
        padding: 0.8rem 1.2rem;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
        box-shadow: var(--shadow);
        transition: var(--transition);
      }

      .price-header:hover {
        border-color: var(--primary-color);
      }

      .price-options {
        position: absolute;
        top: 100%;
        left: 1.5rem;
        right: 1.5rem;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        margin-top: 5px;
        padding: 0.5rem 0;
        box-shadow: var(--shadow);
        z-index: 10;
        display: flex;
        flex-direction: column;
      }

      .price-options.hide {
        display: none;
      }

      .price-options label {
        padding: 0.6rem 1.2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        transition: var(--transition);
      }

      .price-options label:hover {
        background: rgba(37, 99, 235, 0.1);
      }

      /* Filter Buttons (Gender/Category) */
      .filter-buttons {
        max-width: 600px;
        margin: 0 auto 2rem auto;
        padding: 0 1.5rem;
        display: flex;
        gap: 10px;
      }

      .filter-buttons button {
        flex: 1;
        padding: 0.7rem;
        border-radius: 12px;
        border: 1px solid var(--glass-border);
        background: var(--card-bg);
        backdrop-filter: blur(8px);
        color: var(--text-color);
        font-weight: 700;
        cursor: pointer;
        box-shadow: var(--shadow);
        transition: var(--transition);
      }

      .filter-buttons button:hover {
        background: var(--primary-color);
        color: #fff;
        border-color: var(--primary-color);
      }

      /* --- Custom Video / Media Section --- */
      .custom-video-section {
        max-width: 1000px;
        margin: 0 auto 2rem auto;
        padding: 0 1.5rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .custom-video-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .custom-video-wrapper {
        position: relative;
        width: 100%;
        height: 220px;
      }

      .custom-video-wrapper iframe,
      .custom-video-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border: none;
      }

      .custom-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        z-index: 2;
      }

      .custom-video-content {
        padding: 1rem;
        font-weight: 700;
        text-align: center;
      }

      /* --- Apartments Grid Container --- */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1.5rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1.5rem;
      }

      /* Apartment Card Style */
      .apartment-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        transition: var(--transition);
        position: relative;
      }

      .apartment-card:hover {
        transform: translateY(-5px);
        border-color: var(--primary-color);
      }

      .apartment-media {
        width: 100%;
        height: 200px;
        position: relative;
        background: #000;
      }

      .apartment-media img,
      .apartment-media video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .apartment-content {
        padding: 1.2rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        justify-content: space-between;
        gap: 1rem;
      }

      .apartment-title {
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.5;
      }

      .apartment-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--glass-border);
        padding-top: 0.8rem;
      }

      .apartment-price {
        font-weight: 900;
        color: var(--primary-color);
      }

      .book-btn {
        background: var(--primary-color);
        color: #fff;
        border: none;
        padding: 0.5rem 1.2rem;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
      }

      .book-btn:hover {
        background: var(--primary-hover);
      }

      /* Corner Ribbon for Reserved */
      .corner-ribbon {
        background: #ef4444;
        color: white;
        padding: 2px 10px;
        font-size: 0.75rem;
        font-weight: bold;
        border-radius: 4px;
        display: inline-block;
        margin-right: 5px;
      }

      /* --- Modal / Booking Window --- */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        justify-content: center;
        align-items: center;
        z-index: 2000;
        padding: 1rem;
      }

      .modal-content {
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        padding: 2rem;
        border-radius: 20px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        position: relative;
        animation: scaleUp 0.3s ease;
      }

      @keyframes scaleUp {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .close-btn {
        position: absolute;
        top: 15px;
        left: 20px;
        font-size: 1.5rem;
        cursor: pointer;
        font-weight: bold;
      }

      .modal-input {
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 10px;
        border: 1px solid var(--glass-border);
        background: var(--bg-color);
        color: var(--text-color);
        outline: none;
        font-size: 1rem;
        transition: var(--transition);
      }

      .modal-input:focus {
        border-color: var(--primary-color);
      }

      .confirm-btn {
        width: 100%;
        padding: 0.8rem;
        background: var(--primary-color);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: var(--transition);
      }

      .confirm-btn:hover {
        background: var(--primary-hover);
      }
    </style>
  </head>

            "https://res.cloudinary.com/dxqtdpjp0/video/upload/v1783396217/%D8%B4%D9%82%D8%A9_%D8%AF%D9%88%D8%B1_%D8%AA%D8%A7%D9%86%D9%8A_%D9%81%D9%8A_%D9%81%D9%8A%D9%84%D8%A7_%D9%85%D8%B4%D8%B7%D9%8A%D8%A9_%D8%B3%D9%88%D8%A8%D8%B1_%D9%84%D9%88%D9%83%D8%B3_jnrvxv.mp4",
          ],
        },
        {
          name: "شقة دور ارضي في فيلا متشطبه سوبر لوكس وفيها كاميرات",
          location: "الحكوميه",
          price: "1100$",
          type: "girls",
          images: [
            "https://res.cloudinary.com/dxqtdpjp0/video/upload/v1783396737/WhatsApp_Video_2026-07-04_at_5.24.42_PM_1_seudh2.mp4",
          ],
        },
      ];

      let currentTypeFilter = "all";
      let currentPriceFilter = "all";
      let selectedApt = null;

      // Theme Management
      function toggleTheme() {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const themeBtn = document.querySelector(".theme-toggle");
        if (currentTheme === "dark") {
          document.documentElement.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
          themeBtn.textContent = "🌙";
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
          localStorage.setItem("theme", "dark");
          themeBtn.textContent = "☀️";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
        document.querySelector(".theme-toggle").textContent =
          savedTheme === "dark" ? "☀️" : "🌙";
        render();
      });

      // Price Dropdown Toggle
      function togglePriceFilter() {
        const options = document.getElementById("priceOptions");
        const arrow = document.getElementById("arrow");
        options.classList.toggle("hide");
        arrow.style.transform = options.classList.contains("hide")
          ? "rotate(0deg)"
          : "rotate(180deg)";
      }

      function setPriceFilter(val) {
        currentPriceFilter = val;
        document.getElementById("priceOptions").classList.add("hide");
        document.getElementById("arrow").style.transform = "rotate(0deg)";
        render();
      }

      function filterApartments(type) {
        currentTypeFilter = type;
        render();
      }

      // Render Function
      function render() {
        const searchVal = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const app = document.getElementById("app");
        app.innerHTML = "";

        const filtered = apartments.filter((apt) => {
          const matchesSearch =
            apt.name.toLowerCase().includes(searchVal) ||
            apt.location.toLowerCase().includes(searchVal);
          const matchesType =
            currentTypeFilter === "all" || apt.type === currentTypeFilter;

          let matchesPrice = true;
          if (currentPriceFilter !== "all") {
            const numPrice = parseInt(apt.price);
            const limit = parseInt(currentPriceFilter);
            matchesPrice = !isNaN(numPrice) && numPrice <= limit;
          }

          return matchesSearch && matchesType && matchesPrice;
        });

        if (filtered.length === 0) {
          app.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 3rem; font-weight: 700; opacity: 0.7;">عذراً، لا توجد شقق مطابقة لبحثك.</p>`;
          return;
        }

        filtered.forEach((apt) => {
          const card = document.createElement("div");
          card.className = "apartment-card";

          let mediaHTML = "";
          if (apt.images && apt.images.length > 0) {
            const mediaSrc = apt.images[0];
            if (mediaSrc.endsWith(".mp4") || mediaSrc.includes("video")) {
              mediaHTML = `<div class="apartment-media"><video src="${mediaSrc}" controls preload="metadata"></video></div>`;
            } else {
              mediaHTML = `<div class="apartment-media"><img src="${mediaSrc}" alt="صورة الشقة" loading="lazy" /></div>`;
            }
          }

          card.innerHTML = `
            ${mediaHTML}
            <div class="apartment-content">
              <div class="apartment-title">${apt.name}</div>
              <div class="apartment-footer">
                <span class="apartment-price">${apt.price ? apt.price + " جنيه" : "السعر عند الاتصال"}</span>
                <button class="book-btn" onclick="openModal('${apt.name.replace(/'/g, "\\'")}')">احجز الآن</button>
              </div>
            </div>
          `;
          app.appendChild(card);
        });
      }

      // Modal Handlers
      function openModal(aptName) {
        selectedApt = aptName;
        document.getElementById("apt-details-text").innerText =
          "الشقة المطلوبة: " + aptName;
        document.getElementById("bookingModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("bookingModal").style.display = "none";
      }

      function submitBooking(event) {
        event.preventDefault();
        const name = document.getElementById("studentName").value;
        const phone = document.getElementById("studentPhone").value;
        const message = `مرحباً، أريد تأكيد حجز الشقة التالية:\n- الشقة: ${selectedApt}\n- الاسم: ${name}\n- رقم التليفون: ${phone}`;
        const whatsappUrl = `https://wa.me/201152638852?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, "_blank");
        closeModal();
      }

      window.onclick = function (event) {
        const modal = document.getElementById("bookingModal");
        if (event.target === modal) {
          closeModal();
        }
      };
    </script>

    <!-- شباك الحجز (Modal) -->
    <div id="bookingModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 style="margin-bottom: 15px; color: var(--primary-color)">
          تأكيد الحجز 🏠
        </h2>
        <p
          id="apt-details-text"
          style="margin-bottom: 20px; font-size: 14px; opacity: 0.85"
        ></p>

        <form id="bookingForm" onsubmit="submitBooking(event)">
          <div class="form-group" style="margin-bottom: 15px">
            <input
              type="text"
              id="studentName"
              placeholder="الاسم ثلاثي"
              required
              class="modal-input"
            />
          </div>
          <div class="form-group" style="margin-bottom: 20px">
            <input
              type="tel"
              id="studentPhone"
              placeholder="رقم التليفون (واتساب)"
              required
              class="modal-input"
            />
          </div>
          <button type="submit" class="confirm-btn">تأكيد وإرسال الطلب</button>
        </form>
      </div>
    </div>
  </body>
</html>
