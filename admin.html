<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة التحكم | سكن اللوتس</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <div class="admin-header">
      <h1>لوحة التحكم ⚙️</h1>
      <div class="tabs">
        <button class="tab-btn active" onclick="showSection('add-apt')">
          إضافة شقة
        </button>
        <button
          class="tab-btn"
          onclick="
            showSection('manage-apts');
            fetchAdminApartments();
          "
        >
          إدارة الشقق
        </button>
        <button
          class="tab-btn"
          onclick="
            showSection('requests');
            fetchBookings();
          "
        >
          طلبات الحجز
        </button>
      </div>
    </div>

    <!-- قسم إضافة شقة -->
    <div id="add-apt" class="section active">
      <h2 style="margin-bottom: 20px">إضافة شقة جديدة</h2>
      <form id="apartmentForm" onsubmit="submitApartment(event)">
        <div class="form-group">
          <label>تفاصيل ووصف الشقة</label>
          <textarea
            class="form-control"
            placeholder="مثال: شقة في عمارة 62 دور رابع..."
          ></textarea>
        </div>
        <div class="form-group">
          <label>المنطقة</label>
          <select class="form-control" required>
            <option value="" disabled selected>
              -- اختار المنطقة أولاً --
            </option>
            <option value="ال77">الـ 77 عمارة</option>
            <option value="ال7 عماير">ال7 عماير</option>
            <option value="الحكوميه">الحكومية</option>
            <option value="القرنفل">القرنفل</option>
            <option value="ابني بيتك">ابني بيتك</option>
            <option value="سكن مصر">سكن مصر</option>
            <option value="البريطانيه">البريطانيه</option>
          </select>
        </div>
        <div class="form-group">
          <label>النوع</label>
          <select class="form-control">
            <option value="girls">بنات 👩</option>
            <option value="boys">شباب 👨</option>
          </select>
        </div>
        <div class="form-group">
          <label>السعر (اختياري)</label>
          <input type="number" class="form-control" placeholder="مثال: 1000" />
        </div>
        <div class="form-group">
          <label>الصور (ممكن تختار أكتر من ملف)</label>
          <input type="file" class="form-control" accept="image/*" multiple />
        </div>

        <!-- زود الكود ده هنا -->
        <div class="form-group">
          <label>لينك الفيديو من Cloudinary (اختياري)</label>
          <input
            type="url"
            class="form-control"
            id="videoLinkInput"
            placeholder="الصق رابط الفيديو من Cloudinary هنا..."
            dir="ltr"
          />
        </div>
        <button type="submit" class="submit-btn">حفظ الشقة ✔️</button>
      </form>
    </div>

    <!-- قسم إدارة الشقق -->
    <div id="manage-apts" class="section">
      <h2 style="margin-bottom: 20px">إدارة الشقق المضافة 🏢</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>الوصف</th>
              <th>المنطقة</th>
              <th>السعر</th>
              <th>الحالة</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="admin-apts-list">
            <!-- سيتم ملء هذا الجزء برمجياً -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- قسم طلبات الحجز -->
    <div id="requests" class="section">
      <h2 style="margin-bottom: 20px">طلبات الحجز الحالية 📋</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>رقم التليفون</th>
              <th>الشقة المطلوبة</th>
              <th>التاريخ</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="5" style="text-align: center">
                لا توجد طلبات حجز بعد
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      function showSection(sectionId) {
        document
          .querySelectorAll(".section")
          .forEach((sec) => sec.classList.remove("active"));
        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));

        document.getElementById(sectionId).classList.add("active");
        event.target.classList.add("active");
      }

      async function submitApartment(event) {
        event.preventDefault();
        const form = document.getElementById("apartmentForm");
        const submitBtn = document.querySelector(".submit-btn");
        const formData = new FormData();

        formData.append("description", form.querySelector("textarea").value);
        formData.append("location", form.querySelectorAll("select")[0].value);
        formData.append("type", form.querySelectorAll("select")[1].value);
        formData.append(
          "price",
          form.querySelector('input[type="number"]').value,
        );

        // إضافة لينك الفيديو الجديد
        const videoLink = document.getElementById("videoLinkInput").value;
        formData.append("videoUrl", videoLink);

        // رفع الصور فقط من الجهاز
        const fileInput = form.querySelector('input[type="file"]');
        for (let i = 0; i < fileInput.files.length; i++) {
          formData.append("media", fileInput.files[i]);
        }

        try {
          submitBtn.textContent = "جاري الرفع... ⏳";
          submitBtn.disabled = true;

          const response = await fetch(
            "https://sakan-sigma.vercel.app/api/apartments",
            {
              method: "POST",
              body: formData,
            },
          );

          const result = await response.json();

          if (response.ok) {
            alert("تم حفظ الشقة بنجاح! 🎉");
            form.reset();
          } else {
            alert("حصل خطأ: " + result.error);
          }
        } catch (error) {
          console.error("Error:", error);
          alert("حصل خطأ في الاتصال بالسيرفر!");
        } finally {
          submitBtn.textContent = "حفظ الشقة ✔️";
          submitBtn.disabled = false;
        }
      }

      // جلب الشقق لجدول الإدارة
      async function fetchAdminApartments() {
        const tbody = document.getElementById("admin-apts-list");
        tbody.innerHTML =
          '<tr><td colspan="5" style="text-align:center;">جاري التحميل... ⏳</td></tr>';
        try {
          // تم تعديل الرابط هنا
          const res = await fetch(
            "https://sakan-sigma.vercel.app/api/apartments",
          );
          const apts = await res.json();

          if (apts.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="5" style="text-align:center;">لم تقم بإضافة أي شقق من لوحة التحكم حتى الآن.</td></tr>';
            return;
          }

          tbody.innerHTML = "";
          apts.forEach((apt) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                        <td>${apt.description.length > 30 ? apt.description.substring(0, 30) + "..." : apt.description}</td>
                        <td>${apt.location}</td>
                        <td>
                            <input type="number" id="price-${apt._id}" value="${apt.price || ""}" class="inline-input">
                        </td>
                        <td>
                            <select id="status-${apt._id}" class="inline-select">
                                <option value="متاحة" ${apt.status === "متاحة" ? "selected" : ""}>متاحة</option>
                                <option value="محجوزة" ${apt.status === "محجوزة" ? "selected" : ""}>محجوزة</option>
                            </select>
                        </td>
                        <td>
                            <button onclick="updateApt('${apt._id}')" class="action-edit">تحديث</button>
                            <button onclick="deleteApt('${apt._id}')" class="action-delete">حذف</button>
                        </td>
                    `;
            tbody.appendChild(tr);
          });
        } catch (error) {
          tbody.innerHTML =
            '<tr><td colspan="5" style="text-align:center; color:#ef4444;">خطأ في جلب الشقق</td></tr>';
        }
      }

      // تحديث السعر أو الحالة
      async function updateApt(id) {
        const newPrice = document.getElementById(`price-${id}`).value;
        const newStatus = document.getElementById(`status-${id}`).value;

        try {
          // تم تعديل الرابط هنا
          const res = await fetch(
            `https://sakan-sigma.vercel.app/api/apartments/${id}`,
            {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ price: newPrice, status: newStatus }),
            },
          );

          if (res.ok) {
            alert("تم تحديث الشقة بنجاح! ✔️");
          } else {
            alert("حصل خطأ في التحديث");
          }
        } catch (e) {
          alert("خطأ في الاتصال بالسيرفر");
        }
      }

      // حذف الشقة نهائياً
      async function deleteApt(id) {
        if (!confirm("متأكد إنك عايز تحذف الشقة دي نهائياً؟ ⚠️")) return;

        try {
          // تم تعديل الرابط هنا
          const res = await fetch(
            `https://sakan-sigma.vercel.app/api/apartments/${id}`,
            {
              method: "DELETE",
            },
          );

          if (res.ok) {
            alert("تم الحذف بنجاح!");
            fetchAdminApartments(); // إعادة تحميل الجدول بعد الحذف
          }
        } catch (e) {
          alert("خطأ في الحذف");
        }
      }

      // ----------------------------------------------------
      // جلب طلبات الحجز من السيرفر وعرضها في الجدول
      // ----------------------------------------------------
      async function fetchBookings() {
        const tbody = document.querySelector("#requests tbody");
        tbody.innerHTML =
          '<tr><td colspan="5" style="text-align:center;">جاري التحميل... ⏳</td></tr>';

        try {
          // تم تعديل الرابط هنا
          const res = await fetch(
            "https://sakan-sigma.vercel.app/api/bookings",
          );
          const bookings = await res.json();

          if (bookings.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="5" style="text-align:center;">لا توجد طلبات حجز حالياً.</td></tr>';
            return;
          }

          tbody.innerHTML = "";
          bookings.forEach((booking) => {
            // تظهير التاريخ بشكل حلو
            const date = new Date(booking.date).toLocaleDateString("ar-EG");

            // تظبيط رقم الواتساب (عشان لو كتب 010 بنشيل الصفر الأولاني ونحط كود مصر 20)
            let phoneForWa = booking.phone;
            if (phoneForWa.startsWith("0")) {
              phoneForWa = phoneForWa.substring(1);
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `
                    <td>${booking.userName}</td>
                    <td dir="ltr" style="text-align: right;">${booking.phone}</td>
                    <td>${booking.apartmentDetails}</td>
                    <td>${date}</td>
                    <td><a href="https://wa.me/20${phoneForWa}" target="_blank" class="wa-btn">تواصل واتساب</a></td>
                `;
            tbody.appendChild(tr);
          });
        } catch (error) {
          tbody.innerHTML =
            '<tr><td colspan="5" style="text-align:center; color:#ef4444;">خطأ في جلب الطلبات</td></tr>';
        }
      }
    </script>
  </body>
</html>
