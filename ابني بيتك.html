<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>شقق جامعة اللوتس</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <header>
      <div class="logo">
        <h1>جامعة اللوتس</h1>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="🔍 ابحث عن شقة أو منطقة..."
        onkeyup="render()"
      />
    </div>
    <div class="price-filter">
      <div class="price-header" onclick="togglePriceFilter()">
        <span>💰 السعر</span>
        <span id="arrow">▼</span>
      </div>

      <div id="priceOptions" class="price-options hide">
        <label
          ><input
            type="radio"
            name="price"
            checked
            onclick="setPriceFilter('all')"
          />
          الكل</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('900')" />
          حتى 900 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1000')" />
          حتى 1000 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1200')" />
          حتى 1200 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1500')" />
          حتى 1500 جنيه</label
        >
      </div>
    </div>
    <div class="filter-buttons">
      <button onclick="filterApartments('all')">🏠 الكل</button>
      <button onclick="filterApartments('girls')">👩 بنات</button>
      <button onclick="filterApartments('boys')">👨 شباب</button>
    </div>

    <div class="custom-video-section">
      <div class="custom-video-card">
        <div class="custom-video-wrapper">
          <span class="custom-badge">فيديو المنطقة 🎥</span>
          <iframe
            src=""
            width="100%"
            height="250"
            allow="autoplay"
            allowfullscreen
          >
          </iframe>
        </div>
        <div class="custom-video-content">
          <p>منطقة الحكومية</p>
        </div>
      </div>
      <div class="custom-video-card">
        <div class="custom-video-wrapper">
          <img
            src="https://res.cloudinary.com/dxqtdpjp0/image/upload/v1782034263/%D8%A7%D9%84%D8%B4%D9%82%D9%82/%D9%85%D9%86%D8%B7%D9%82%D8%A9%20%D8%A7%D9%84%D8%AD%D9%83%D9%88%D9%85%D9%8A%D8%A9/%D9%85%D9%86%D8%B7%D9%82%D8%A9%20%D8%A7%D9%84%D8%AD%D9%83%D9%88%D9%85%D9%8A%D8%A9/pic_wgjzjv.jpg"
            alt="خريطة المنطقة على جوجل ماب"
            onclick="openFullImg(this)"
            style="cursor: zoom-in"
          />
          <div class="custom-media-content"></div>
        </div>
      </div>
    </div>

    <!-- الشقق -->
    <div class="container" id="app"></div>

    <script>
      let apartments = [
        {
          name: "شقة قصاد بوابه 2 دور أرضي قبل سوبر ماركت عمي علي، 7 سراير",
          location: "ابني بيتك",
          price: "900$",
          type: "boys",
          images: [
            "https://res.cloudinary.com/dxqtdpjp0/video/upload/v1783397013/%D8%B4%D9%82%D8%A9_%D9%81%D9%8A_%D8%A7%D8%A8%D9%86%D9%8A_%D8%A8%D9%8A%D8%AA%D9%83_%D9%82%D8%B5%D8%A7%D8%AF_%D8%A8%D9%88%D8%A7%D8%A8%D9%87_2_%D8%AF%D9%88%D8%B1_%D8%A3%D8%B1%D8%B6%D9%8A_%D9%82%D8%A8%D9%84_%D8%B3%D9%88%D8%A8%D8%B1_%D9%85%D8%A7%D8%B1%D9%83%D8%AA_%D8%B9%D9%85%D9%8A_%D8%B9%D9%84%D9%8A_p3vqad.mp4",
          ],
        },
        {
          name: "شقه دور ارضي مقفله حديد هيتضاف فيها ديب فريزر و غساله جديده و 3 مراوح سقف جداد",
          location: "ابني بيتك",
          price: "850$",
          type: "girls",
          images: [
            "https://res.cloudinary.com/dxqtdpjp0/video/upload/v1783397274/%D8%B4%D9%82%D8%A9_%D9%81%D9%8A_%D8%A7%D8%A8%D9%86%D9%8A_%D8%A8%D9%8A%D8%AA%D9%83_%D8%AF%D9%88%D8%B1_%D8%A3%D8%B1%D8%B6%D9%8A_%D9%85%D9%82%D9%81%D9%84%D8%A9_%D8%AD%D8%AF%D9%8A%D8%AF_gedihj.mp4",
          ],
        },
      ];
    </script>
    <script src="main.js"></script>
    <script src="dark.js"></script>
  </body>
</html>
