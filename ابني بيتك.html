<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شقق جامعة اللوتس | الدليل الشامل</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Background Elements -->
    <div class="bg-animation">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>

    <!-- Top Control Panel (Header, Search, Price, and Type Filters combined cleanly) -->
    <div class="top-control-panel">
      <header>
        <div class="logo">
          <h1>شقق جامعة اللوتس</h1>
        </div>
        <button
          class="theme-toggle"
          onclick="toggleTheme()"
          aria-label="تبديل الثيم"
        >
          🌙
        </button>
      </header>

      <div class="filters-row">
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="🔍 ابحث عن شقة أو رقم عمارة..."
            onkeyup="render()"
          />
        </div>

        <div class="price-filter">
          <div class="price-header" onclick="togglePriceFilter()">
            <span>💰 تصفية حسب السعر</span>
            <span id="arrow">▼</span>
          </div>

          <div id="priceOptions" class="price-options hide">
            <label>
              <input
                type="radio"
                name="price"
                checked
                onclick="setPriceFilter('all')"
              />
              الكل
            </label>
            <label>
              <input
                type="radio"
                name="price"
                onclick="setPriceFilter('900')"
              />
              حتى 900 جنيه
            </label>
            <label>
              <input
                type="radio"
                name="price"
                onclick="setPriceFilter('1000')"
              />
              حتى 1000 جنيه
            </label>
            <label>
              <input
                type="radio"
                name="price"
                onclick="setPriceFilter('1200')"
              />
              حتى 1200 جنيه
            </label>
            <label>
              <input
                type="radio"
                name="price"
                onclick="setPriceFilter('1500')"
              />
              حتى 1500 جنيه
            </label>
          </div>
        </div>

        <div class="filter-buttons">
          <button onclick="filterApartments('all')">🏠 الكل</button>
          <button onclick="filterApartments('girls')">👩 بنات</button>
          <button onclick="filterApartments('boys')">👨 شباب</button>
        </div>
      </div>
    </div>

    <div class="custom-video-section">
      <div class="custom-video-card">
        <div class="custom-video-wrapper">
          <span class="custom-badge">فيديو المنطقة 🎥</span>
          <iframe
            src="https://drive.google.com/file/d/1JaaW8uGei3fjLiEcvdY9CsoE2EnrpJc5/preview"
            allowfullscreen
          ></iframe>
        </div>
        <div class="custom-video-content">
          <p>منطقة ابني بيتك</p>
        </div>
      </div>
      <div class="custom-video-card">
        <div class="custom-video-wrapper">
          <span class="custom-badge">خريطة المنطقة 🗺️</span>
          <img
            src="https://drive.google.com/file//1cn0lUJ-R9OuBbhfTuIC_o1IqtMTSwNsc/preview"
            alt="خريطة المنطقة على جوجل ماب"
            style="cursor: zoom-in"
          />
        </div>
        <div class="custom-video-content">
          <p>موقع ابني بيتك</p>
        </div>
      </div>
    </div>

    <!-- الشقق -->
    <div class="container" id="app"></div>

    <!-- شباك الحجز (Modal) -->
    <div id="bookingModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2
          style="
            margin-bottom: 12px;
            color: var(--primary-color);
            font-weight: 800;
          "
        >
          تأكيد الحجز 🏠
        </h2>
        <p
          id="apt-details-text"
          style="
            margin-bottom: 22px;
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
          "
        ></p>

        <form id="bookingForm" onsubmit="submitBooking(event)">
          <div style="margin-bottom: 16px">
            <input
              type="text"
              id="studentName"
              placeholder="الاسم ثلاثي"
              required
              class="modal-input"
            />
          </div>
          <div style="margin-bottom: 24px">
            <input
              type="tel"
              id="studentPhone"
              placeholder="رقم التليفون (واتساب)"
              required
              class="modal-input"
            />
          </div>
          <button type="submit" class="confirm-btn">تأكيد وإرسال الطلب</button>
        </form>
      </div>
    </div>

    <script>
      let apartments = [
        {
          name: "شقة قصاد بوابه 2 دور أرضي قبل سوبر ماركت عمي علي، 7 سراير",
          location: "ابني بيتك",
          price: "900", // تم جعل السعر رقماً صحيحاً لكي تعمل الفلترة بدقة
          type: "boys",
          images: [""],
        },
        {
          name: "شقه دور ارضي مقفله حديد هيتضاف فيها ديب فريزر و غساله جديده و 3 مراوح سقف جداد",
          location: "ابني بيتك",
          price: "850",
          type: "girls",
          images: [
            "https://res.cloudinary.com/dxqtdpjp0/video/upload/v1783397274/%D8%B4%D9%82%D8%A9_%D9%81%D9%8A_%D8%A7%D8%A8%D9%86%D9%8A_%D8%A8%D9%8A%D8%AA%D9%83_%D8%AF%D9%88%D8%B1_%D8%A3%D8%B1%D8%B6%D9%8A_%D9%85%D9%82%D9%81%D9%84%D8%A9_%D8%AD%D8%AF%D9%8A%D8%AF_gedihj.mp4",
          ],
        },
      ];

      let currentTypeFilter = "all";
      let currentPriceFilter = "all";
      let selectedApt = null;

      function toggleTheme() {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const themeBtn = document.querySelector(".theme-toggle");
        if (currentTheme === "dark") {
          document.documentElement.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
          themeBtn.textContent = "🌙";
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
          localStorage.setItem("theme", "dark");
          themeBtn.textContent = "☀️";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
        document.querySelector(".theme-toggle").textContent =
          savedTheme === "dark" ? "☀️" : "🌙";
        render();
      });

      function togglePriceFilter() {
        const options = document.getElementById("priceOptions");
        const arrow = document.getElementById("arrow");
        options.classList.toggle("hide");
        arrow.style.transform = options.classList.contains("hide")
          ? "rotate(0deg)"
          : "rotate(180deg)";
      }

      function setPriceFilter(val) {
        currentPriceFilter = val;
        document.getElementById("priceOptions").classList.add("hide");
        document.getElementById("arrow").style.transform = "rotate(0deg)";
        render();
      }

      function filterApartments(type) {
        currentTypeFilter = type;
        render();
      }

      function render() {
        const searchVal = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const app = document.getElementById("app");
        app.innerHTML = "";

        const filtered = apartments.filter((apt) => {
          const matchesSearch =
            apt.name.toLowerCase().includes(searchVal) ||
            apt.location.toLowerCase().includes(searchVal);
          const matchesType =
            currentTypeFilter === "all" || apt.type === currentTypeFilter;

          let matchesPrice = true;
          if (currentPriceFilter !== "all") {
            const numPrice = parseInt(apt.price);
            const limit = parseInt(currentPriceFilter);
            matchesPrice = !isNaN(numPrice) && numPrice <= limit;
          }

          return matchesSearch && matchesType && matchesPrice;
        });

        if (filtered.length === 0) {
          app.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 3rem; font-weight: 700; opacity: 0.7;">عذراً، لا توجد شقق مطابقة لبحثك.</p>`;
          return;
        }

        filtered.forEach((apt) => {
          const card = document.createElement("div");
          card.className = "apartment-card";

          let mediaHTML = "";
          if (apt.images && apt.images.length > 0) {
            mediaHTML = `
              <div class="apartment-media">
                  <iframe src="${apt.images[0]}" allowfullscreen></iframe>
              </div>`;
          }

          card.innerHTML = `
            ${mediaHTML}
            <div class="apartment-content">
              <div class="apartment-title">${apt.name}</div>
              <div class="apartment-footer">
                <span class="apartment-price">${apt.price ? apt.price + " جنيه" : "السعر عند الاتصال"}</span>
                <button class="book-btn" onclick="openModal('${apt.name.replace(/'/g, "\\'")}')">احجز الآن</button>
              </div>
            </div>
          `;
          app.appendChild(card);
        });
      }

      function openModal(aptName) {
        selectedApt = aptName;
        document.getElementById("apt-details-text").innerText =
          "الشقة المطلوبة: " + aptName;
        document.getElementById("bookingModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("bookingModal").style.display = "none";
      }

      function submitBooking(event) {
        event.preventDefault();
        const name = document.getElementById("studentName").value;
        const phone = document.getElementById("studentPhone").value;
        const message = `مرحباً، أريد تأكيد حجز الشقة التالية:\n- الشقة: ${selectedApt}\n- الاسم: ${name}\n- رقم التليفون: ${phone}`;
        const whatsappUrl = `https://wa.me/201152638852?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, "_blank");
        closeModal();
      }

      window.onclick = function (event) {
        const modal = document.getElementById("bookingModal");
        if (event.target === modal) {
          closeModal();
        }
      };
    </script>
  </body>
</html>
