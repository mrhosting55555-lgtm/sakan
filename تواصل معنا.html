<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شقق جامعة اللوتس | تواصل معنا</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- Root Variables & Theme Setup --- */
      :root {
        --bg-color: #050816;
        --text-color: #ffffff;
        --card-bg: rgba(255, 255, 255, 0.04);
        --glass-border: rgba(255, 255, 255, 0.08);
        --primary-color: #00e5ff;
        --secondary-color: #7c4dff;
        --shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        --transition: all 0.4s ease;
      }

      [data-theme="light"] {
        --bg-color: #f3f7ff;
        --text-color: #111111;
        --card-bg: rgba(255, 255, 255, 0.85);
        --glass-border: rgba(0, 0, 0, 0.06);
        --primary-color: #2563eb;
        --secondary-color: #7c4dff;
        --shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      }

      body {
        margin: 0;
        font-family: "Cairo", sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        min-height: 100vh;
        padding-bottom: 110px;
        box-sizing: border-box;
        direction: rtl;
        transition:
          background 0.4s,
          color 0.4s;
      }

      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }

      /* ===========================
         Header (الهيدر الزجاجي مع زر الثيم)
      =========================== */

      .header {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--glass-border);
        text-align: center;
        padding: 30px 15px;
        position: relative;
        transition: var(--transition);
      }

      .header h1 {
        margin: 0 0 10px 0;
        font-size: 32px;
        font-weight: 900;
        background: linear-gradient(
          90deg,
          var(--primary-color),
          var(--secondary-color)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header p {
        margin: 0;
        font-size: 16px;
        opacity: 0.7;
      }

      .theme-toggle {
        position: absolute;
        top: 25px;
        left: 30px;
        background: transparent;
        border: 1px solid var(--glass-border);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: var(--transition);
        font-size: 1.1rem;
      }

      .theme-toggle:hover {
        background: var(--primary-color);
        border-color: var(--primary-color);
      }

      /* ===========================
         Container & Card (الفورم)
      =========================== */

      .container {
        width: 100%;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 15px;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 30px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: var(--shadow);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* ===========================
         Inputs & Textarea
      =========================== */

      input,
      textarea {
        width: 100%;
        padding: 14px 18px;
        border-radius: 14px;
        border: 1px solid var(--glass-border);
        background: rgba(255, 255, 255, 0.05);
        font-size: 16px;
        color: var(--text-color);
        outline: none;
        transition: all 0.3s;
      }

      [data-theme="light"] input,
      [data-theme="light"] textarea {
        background: rgba(255, 255, 255, 0.9);
        border-color: rgba(0, 0, 0, 0.1);
      }

      input:focus,
      textarea:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
      }

      textarea {
        height: 130px;
        resize: none;
      }

      /* ===========================
         Submit Button
      =========================== */

      .btn {
        background: linear-gradient(
          90deg,
          var(--primary-color),
          var(--secondary-color)
        );
        color: white;
        padding: 14px;
        border-radius: 14px;
        cursor: pointer;
        border: none;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 5px 20px rgba(0, 229, 255, 0.25);
        transition: all 0.4s;
      }

      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(0, 229, 255, 0.4);
        opacity: 0.95;
      }

      /* ===========================
         Bottom Dock (شريط الأيقونات الزجاجي السفلي)
      =========================== */

      .bottom-dock {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 25px;
        padding: 12px 28px;
        border-radius: 40px;
        background: var(--card-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: var(--shadow);
        z-index: 9999;
        transition: all 0.4s ease;
      }

      .bottom-dock a {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .bottom-dock img {
        width: 38px;
        height: 38px;
        object-fit: contain;
        transition: transform 0.3s ease;
      }

      @media (min-width: 769px) {
        .bottom-dock img:hover {
          transform: translateY(-10px) scale(1.2);
          filter: drop-shadow(0 5px 10px rgba(0, 229, 255, 0.5));
        }
      }

      /* ===========================
         Mobile Optimization
      =========================== */

      @media (max-width: 768px) {
        .header {
          padding: 30px 10px;
        }
        .header h1 {
          font-size: 26px;
        }
        .header p {
          font-size: 14px;
        }

        .theme-toggle {
          top: 15px;
          left: 15px;
          width: 34px;
          height: 34px;
          font-size: 0.9rem;
        }

        .container {
          margin: 20px auto;
        }

        .card {
          padding: 20px;
          border-radius: 20px;
        }

        .bottom-dock {
          bottom: 0;
          left: 0;
          transform: none;
          width: 100%;
          border-radius: 0;
          border-inline: none;
          justify-content: center;
          gap: 45px;
          padding: 16px;
        }

        .bottom-dock img {
          width: 34px;
          height: 34px;
        }

        body {
          padding-bottom: 95px;
        }
      }
    </style>
  </head>

  <body>
    <div class="header">
      <button
        class="theme-toggle"
        onclick="toggleTheme()"
        aria-label="تبديل الثيم"
      >
        🌙
      </button>
      <h1>تواصل معنا</h1>
      <p>يسعدنا تواصلك معنا</p>
    </div>

    <div class="container">
      <div class="card">
        <form onsubmit="contactWhatsApp(event)">
          <input type="text" id="name" placeholder="الاسم" required />

          <textarea
            id="message"
            placeholder="اكتب رسالتك..."
            required
          ></textarea>

          <button class="btn" type="submit">إرسال عبر واتساب</button>
        </form>
      </div>
    </div>

    <div class="bottom-dock">
      <a href="https://wa.me/201152638852" target="_blank">
        <img src="whatsapp.png" alt="WhatsApp" />
      </a>

      <a href="https://t.me/Hooda55555" target="_blank">
        <img src="Telegram.png" alt="Telegram" />
      </a>

      <a href="https://www.facebook.com/share/g/1KmaE6Zdiq/" target="_blank">
        <img src="Facebook.png" alt="Facebook" />
      </a>
    </div>

    <script>
      // Theme Management
      function toggleTheme() {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const themeBtn = document.querySelector(".theme-toggle");
        if (currentTheme === "light") {
          document.documentElement.setAttribute("data-theme", "dark");
          localStorage.setItem("theme", "dark");
          themeBtn.textContent = "🌙";
        } else {
          document.documentElement.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
          themeBtn.textContent = "☀️";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
        const themeBtn = document.querySelector(".theme-toggle");
        if (themeBtn) {
          themeBtn.textContent = savedTheme === "light" ? "☀️" : "🌙";
        }
      });

      function contactWhatsApp(e) {
        e.preventDefault();

        let phone = "201152638852";
        let name = document.getElementById("name").value.trim();
        let message = document.getElementById("message").value.trim();

        if (!name || !message) {
          alert("من فضلك املأ البيانات");
          return;
        }

        let fullMessage = `الاسم: ${name}\nالرسالة: ${message}`;
        let url = `https://wa.me/${phone}?text=${encodeURIComponent(fullMessage)}`;

        window.open(url, "_blank");
      }
    </script>
  </body>
</html>
