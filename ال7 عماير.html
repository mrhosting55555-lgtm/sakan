    <meta charset="UTF-8" />

    <link rel="stylesheet" href="style.css" />

  </head>

  <body>
    <header>
      <div class="logo">
        <h1>جامعة اللوتس</h1>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="🔍 ابحث عن شقة أو منطقة..."
        onkeyup="render()"
      />
    </div>
    <div class="price-filter">
      <div class="price-header" onclick="togglePriceFilter()">
        <span>💰 السعر</span>
        <span id="arrow">▼</span>
      </div>

      <div id="priceOptions" class="price-options hide">
        <label
          ><input
            type="radio"
            name="price"
            checked
            onclick="setPriceFilter('all')"
          />
          الكل</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('900')" />
          حتى 900 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1000')" />
          حتى 1000 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1200')" />
          حتى 1200 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1500')" />
          حتى 1500 جنيه</label
        >
      </div>
    </div>
    <div class="filter-buttons">
      <button onclick="filterApartments('all')">🏠 الكل</button>
      <button onclick="filterApartments('girls')">👩 بنات</button>
      <button onclick="filterApartments('boys')">👨 شباب</button>
    </div>

    <div class="custom-video-section">
      <div class="custom-video-card">
        <div class="custom-video-wrapper">
          <span class="custom-badge">فيديو المنطقة 🎥</span>
          <iframe
            src=""
            width="100%"
            height="250"
            allow="autoplay"
            allowfullscreen
          >
          </iframe>
        </div>
        <div class="custom-video-content">
          <p>منطقة الحكومية</p>
        </div>
      </div>
      <div class="custom-video-card">
        <div class="custom-video-wrapper">
          <img
            src="https://res.cloudinary.com/dxqtdpjp0/image/upload/v1782034263/%D8%A7%D9%84%D8%B4%D9%82%D9%82/%D9%85%D9%86%D8%B7%D9%82%D8%A9%20%D8%A7%D9%84%D8%AD%D9%83%D9%88%D9%85%D9%8A%D8%A9/%D9%85%D9%86%D8%B7%D9%82%D8%A9%20%D8%A7%D9%84%D8%AD%D9%83%D9%88%D9%85%D9%8A%D8%A9/pic_wgjzjv.jpg"

            onclick="openFullImg(this)"
            style="cursor: zoom-in"
          />
          <div class="custom-media-content"></div>
        </div>
      </div>
    </div>
