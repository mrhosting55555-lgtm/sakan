<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شقق جامعة اللوتس | المرافق والخدمات</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- Root Variables & Theme Setup --- */
      :root {
        --bg-color: #f8fafc;
        --text-color: #1e293b;
        --card-bg: rgba(255, 255, 255, 0.75);
        --nav-bg: rgba(255, 255, 255, 0.85);
        --glass-border: rgba(255, 255, 255, 0.4);
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --accent-color: #f59e0b;
        --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      [data-theme="dark"] {
        --bg-color: #0f172a;
        --text-color: #f1f5f9;
        --card-bg: rgba(30, 41, 59, 0.7);
        --nav-bg: rgba(15, 23, 42, 0.85);
        --glass-border: rgba(255, 255, 255, 0.08);
        --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Cairo", sans-serif;
        text-decoration: none;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        min-height: 100vh;
        transition:
          background-color 0.4s ease,
          color 0.4s ease;
        padding-bottom: 40px;
      }

      /* --- Animated Background Blobs --- */
      .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
        filter: blur(80px);
        opacity: 0.4;
      }

      .blob {
        position: absolute;
        border-radius: 50%;
        will-change: transform;
        animation: floatBlobs 20s infinite alternate;
      }

      .blob-1 {
        width: 400px;
        height: 400px;
        background: #3b82f6;
        top: -100px;
        right: -100px;
      }
      .blob-2 {
        width: 500px;
        height: 500px;
        background: #ec4899;
        bottom: -150px;
        left: -150px;
        animation-delay: -5s;
      }

      @keyframes floatBlobs {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(50px, 80px) scale(1.1);
        }
      }

      /* --- Header --- */
      header {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 5%;
        background: var(--nav-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--glass-border);
        z-index: 1000;
        box-shadow: var(--shadow);
      }

      .logo h1 {
        font-size: 1.4rem;
        font-weight: 900;
        color: var(--text-color);
      }

      .theme-toggle {
        background: transparent;
        border: 1px solid var(--glass-border);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: var(--transition);
        font-size: 1.1rem;
      }

      .theme-toggle:hover {
        background: var(--primary-color);
        border-color: var(--primary-color);
      }

      /* --- Main Content --- */
      .main-content {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 1.5rem;
      }

      .title {
        text-align: center;
        font-size: 2.2rem;
        font-weight: 900;
        margin-bottom: 40px;
        color: var(--text-color);
      }

      .container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 25px 20px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: var(--shadow);
        text-align: center;
        transition: var(--transition);
      }

      .card:hover {
        transform: translateY(-8px);
        border-color: var(--primary-color);
        box-shadow: 0 15px 30px rgba(37, 99, 235, 0.15);
      }

      .name {
        font-size: 1.15rem;
        font-weight: 700;
        margin-bottom: 20px;
        color: var(--text-color);
        line-height: 1.4;
      }

      .call-btn {
        display: block;
        background: var(--primary-color);
        color: #fff;
        padding: 12px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        transition: var(--transition);
      }

      .call-btn:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
      }
    </style>
  </head>

  <body>
    <!-- Background Elements -->
    <div class="bg-animation">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>

    <header>
      <div class="logo">
        <h1>جامعة اللوتس</h1>
      </div>
      <button
        class="theme-toggle"
        onclick="toggleTheme()"
        aria-label="تبديل الثيم"
      >
        🌙
      </button>
    </header>

    <div class="main-content">
      <div class="title">الخدمات والمرافق في المنطقة</div>
      <div class="container" id="services"></div>
    </div>

    <script>
      const services = [
        { name: "سوبر ماركت كيمت", phone: "01016132032" },
        { name: "سوبر ماركت أسر الشهداء", phone: "01066966703" },
        { name: "القرطبي أنابيب", phone: "01017280277" },
        { name: "صيدلية د. مروه", phone: "01063500929" },
        { name: "صيدلية د. أحمد اسماعيل", phone: "01126999444" },
        { name: "صيدلية د. أحمد اسماعيل", phone: "01010771112" },
        { name: "صيدلية د. أحمد اسماعيل", phone: "01126999888" },
        { name: "كريم أنابيب", phone: "01098155996" },
        { name: "ديلفري", phone: "01055629514" },
        { name: "أكل منزلي", phone: "01044519826" },
        { name: "كهربائي محمود عبد الحكم", phone: "01009766793" },
        { name: "كهربائي عمرو احمد", phone: "01020327131" },
        { name: "كهربائي محمد زين", phone: "01000622314" },
        { name: "سباك هيثم", phone: "01097687540" },
        { name: "سباك محمد شعبان", phone: "01096996152" },
        { name: "سباك ابانوب", phone: "01550506315" },
        { name: "حداد محمد", phone: "01000316317" },
        { name: "حداد الزهراء", phone: "01061901959" },
        { name: "نقاش محمد", phone: "01009131062" },
        { name: "نقاش ابو مينا", phone: "01069874424" },
        { name: "تروسكل نادر", phone: "01023096319" },
        { name: "تروسكل ابو شمس", phone: "01127046079" },
        { name: "كهربائي الزهراء", phone: "01022690969" },
        { name: "محل أدوات كهرباء", phone: "01012013618" },
        { name: "خياطة أم سمر", phone: "01050440212" },
        { name: "كشري هند", phone: "01060107502" },
        { name: "كافيه ريفيرا", phone: "01050919722" },
        { name: "كيميت", phone: "01016132032" },
        { name: "أسر الشهداء", phone: "01066966703" },
      ];

      const container = document.getElementById("services");

      services.forEach((s) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="name">${s.name}</div>
          <a class="call-btn" href="tel:${s.phone}">
            📞 ${s.phone}
          </a>
        `;

        container.appendChild(card);
      });

      // Theme Management
      function toggleTheme() {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const themeBtn = document.querySelector(".theme-toggle");
        if (currentTheme === "dark") {
          document.documentElement.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
          themeBtn.textContent = "🌙";
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
          localStorage.setItem("theme", "dark");
          themeBtn.textContent = "☀️";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
        const themeBtn = document.querySelector(".theme-toggle");
        if (themeBtn) {
          themeBtn.textContent = savedTheme === "dark" ? "☀️" : "🌙";
        }
      });
    </script>
  </body>
</html>
