<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>شقق جامعة اللوتس</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <header>
      <div class="logo">
        <h1>جامعة اللوتس</h1>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="🔍 ابحث عن شقة أو منطقة..."
        onkeyup="render()"
      />
    </div>
    <div class="price-filter">
      <div class="price-header" onclick="togglePriceFilter()">
        <span>💰 السعر</span>
        <span id="arrow">▼</span>
      </div>

      <div id="priceOptions" class="price-options hide">
        <label
          ><input
            type="radio"
            name="price"
            checked
            onclick="setPriceFilter('all')"
          />
          الكل</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('900')" />
          حتى 900 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1000')" />
          حتى 1000 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1200')" />
          حتى 1200 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1500')" />
          حتى 1500 جنيه</label
        >
      </div>
    </div>
    <div class="filter-buttons">
      <button onclick="filterApartments('all')">🏠 الكل</button>
      <button onclick="filterApartments('girls')">👩 بنات</button>
      <button onclick="filterApartments('boys')">👨 شباب</button>
    </div>

    <div class="custom-video-section">
      <div class="custom-video-card">
        <div class="custom-video-wrapper">
          <span class="custom-badge">فيديو المنطقة 🎥</span>
          <iframe
            src=""
            width="100%"
            height="250"
            allow="autoplay"
            allowfullscreen
          >
          </iframe>
        </div>
        <div class="custom-video-content">
          <p>منطقة الحكومية</p>
        </div>
      </div>
      <div class="custom-video-card">
        <div class="custom-video-wrapper">
          <img
            src="https://res.cloudinary.com/dxqtdpjp0/image/upload/v1782034263/%D8%A7%D9%84%D8%B4%D9%82%D9%82/%D9%85%D9%86%D8%B7%D9%82%D8%A9%20%D8%A7%D9%84%D8%AD%D9%83%D9%88%D9%85%D9%8A%D8%A9/%D9%85%D9%86%D8%B7%D9%82%D8%A9%20%D8%A7%D9%84%D8%AD%D9%83%D9%88%D9%85%D9%8A%D8%A9/pic_wgjzjv.jpg"
            alt="خريطة المنطقة على جوجل ماب"
            onclick="openFullImg(this)"
            style="cursor: zoom-in"
          />
          <div class="custom-media-content"></div>
        </div>
      </div>
    </div>

    <!-- الشقق -->
    <div class="container" id="app"></div>

    <script>
      let currentFilter = "all";
      let priceFilter = "all";

      const apartments = [
        /*{
          name: "شقة في عمارة 62",
          location: "ال77",
          price: "",
          type: "girls",
          images: ["./الشقق/منطقة ال 77 عمارة/عماره 62/vid.mp4"],
        },*/
      ];

      function filterApartments(type) {
        currentFilter = type;
        render();
      }

      function render() {
        const app = document.getElementById("app");
        app.innerHTML = "";

        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();

        apartments
          .filter((apt) => {
            const price = parseInt(apt.price);
            let priceMatch = true;
            switch (priceFilter) {
              case "900":
                priceMatch = price <= 900;
                break;

              case "1000":
                priceMatch = price <= 1000;
                break;

              case "1200":
                priceMatch = price <= 1200;
                break;

              case "1500":
                priceMatch = price <= 1500;
                break;

              default:
                priceMatch = true;
            }
            return (
              (currentFilter === "all" || apt.type === currentFilter) &&
              (apt.name.toLowerCase().includes(search) ||
                apt.location.toLowerCase().includes(search)) &&
              (priceFilter === "all" ? true : !isNaN(price) && priceMatch)
            );
          })
          .forEach((apt) => {
            const card = document.createElement("div");
            card.className = "card";

            // فحص وجود شريط محجوزة داخل النص لنقله إلى هيكل الكارت الرئيسي تلافيًا لمشاكل الـ Overflow
            let ribbonHTML = "";
            if (apt.name.includes("corner-ribbon")) {
              if (apt.name.includes("reserved"))
                ribbonHTML = `<span class="corner-ribbon reserved">محجوزة</span>`;
              else
                ribbonHTML = `<span class="corner-ribbon available">متاحة</span>`;
            }

            card.innerHTML = `
            ${ribbonHTML}
            <div class="slider">
              ${apt.images
                .map((file, i) => {
                  const isActive = i === 0 ? "active" : "";

                  if (file.includes("drive.google.com/file/d/")) {
                    const embedUrl = file.replace(
                      "/view?usp=drive_link",
                      "/preview",
                    );
                    return `<iframe class="slider-item ${isActive}" src="${embedUrl}" allow="autoplay" allowfullscreen></iframe>`;
                  }

                  if (file.endsWith(".mp4")) {
                    return `
                      <video class="slider-item ${isActive}" controls>
                        <source src="${file}" type="video/mp4">
                        متصفحك لا يدعم تشغيل الفيديو.
                      </video>
                    `;
                  }

                  return `<img src="${file}" class="slider-item ${isActive}">`;
                })
                .join("")}

              <div class="nav">
                <button onclick="prev(this)">❮</button>
                <button onclick="next(this)">❯</button>
              </div>
            </div>

            <div class="card-content">
              <div class="title">${apt.name.replace(/<span[^>]*>([^<]*)<\/span>/g, "")}</div>
              <div class="action-btn">
                <div class="price-btn">${apt.price || "اتصل لمعرفة السعر"}</div>
                <div class="book-btn" onclick="bookNow('${apt.name.replace(/'/g, "\\'")}', '${apt.location}', '${apt.price}')">احجز</div>
              </div>
            </div>
          `;

            app.appendChild(card);
          });
      }

      // دالة التنقل الموحدة والآمنة لجميع أنواع عناصر الميديا
      function next(btn) {
        let slider = btn.closest(".slider");
        let items = slider.querySelectorAll(".slider-item");
        if (items.length <= 1) return;

        let index = [...items].findIndex((el) =>
          el.classList.contains("active"),
        );
        items[index].classList.remove("active");
        items[(index + 1) % items.length].classList.add("active");
      }

      function prev(btn) {
        let slider = btn.closest(".slider");
        let items = slider.querySelectorAll(".slider-item");
        if (items.length <= 1) return;

        let index = [...items].findIndex((el) =>
          el.classList.contains("active"),
        );
        items[index].classList.remove("active");
        items[(index - 1 + items.length) % items.length].classList.add(
          "active",
        );
      }

      function bookNow(name, location, price) {
        let phone = "201152638852";
        let cleanName = name.replace(/<span[^>]*>([^<]*)<\/span>/g, "").trim();
        let message = `عايز احجز:\n\n${cleanName}\n\nالموقع: ${location}\nالسعر: ${price || "اتصل لمعرفة السعر"}`;
        let url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        window.open(url, "_blank");
      }

      function openFullImg(element) {
        const fullImgBox = document.getElementById("fullImgBox");
        const fullImg = document.getElementById("fullImg");
        fullImg.src = element.src;
        fullImgBox.style.display = "flex";
      }

      function closeFullImg() {
        document.getElementById("fullImgBox").style.display = "none";
      }

      function setPriceFilter(value) {
        priceFilter = value;
        render();
      }

      function togglePriceFilter() {
        const options = document.getElementById("priceOptions");
        const arrow = document.getElementById("arrow");
        options.classList.toggle("hide");
        arrow.textContent = options.classList.contains("hide") ? "▼" : "▲";
      }

      // تشغيل أول رندر عند تحميل الصفحة
      render();
    </script>
    <script src="dark.js"></script>
  </body>
</html>
