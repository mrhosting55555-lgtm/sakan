<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>شقق جامعة اللوتس</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <header>
      <div class="logo">
        <h1>جامعة اللوتس</h1>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="🔍 ابحث عن شقة أو منطقة..."
        onkeyup="render()"
      />
    </div>
    <div class="price-filter">
      <div class="price-header" onclick="togglePriceFilter()">
        <span>💰 السعر</span>
        <span id="arrow">▼</span>
      </div>

      <div id="priceOptions" class="price-options hide">
        <label
          ><input
            type="radio"
            name="price"
            checked
            onclick="setPriceFilter('all')"
          />
          الكل</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('900')" />
          حتى 900 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1000')" />
          حتى 1000 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1200')" />
          حتى 1200 جنيه</label
        >

        <label
          ><input type="radio" name="price" onclick="setPriceFilter('1500')" />
          حتى 1500 جنيه</label
        >
      </div>
    </div>
    <div class="filter-buttons">
      <button onclick="filterApartments('all')">🏠 الكل</button>
      <button onclick="filterApartments('girls')">👩 بنات</button>
      <button onclick="filterApartments('boys')">👨 شباب</button>
    </div>

    <div class="custom-video-section">
      <div class="custom-video-card">
        <div class="custom-video-wrapper">
          <span class="custom-badge">فيديو المنطقة 🎥</span>
          <iframe
            src=""
            width="100%"
            height="250"
            allow="autoplay"
            allowfullscreen
          >
          </iframe>
        </div>
        <div class="custom-video-content">
          <p>منطقة الحكومية</p>
        </div>
      </div>
      <div class="custom-video-card">
        <div class="custom-video-wrapper">
          <img
            src="https://res.cloudinary.com/dxqtdpjp0/image/upload/v1782034263/%D8%A7%D9%84%D8%B4%D9%82%D9%82/%D9%85%D9%86%D8%B7%D9%82%D8%A9%20%D8%A7%D9%84%D8%AD%D9%83%D9%88%D9%85%D9%8A%D8%A9/%D9%85%D9%86%D8%B7%D9%82%D8%A9%20%D8%A7%D9%84%D8%AD%D9%83%D9%88%D9%85%D9%8A%D8%A9/pic_wgjzjv.jpg"
            alt="خريطة المنطقة على جوجل ماب"
            onclick="openFullImg(this)"
            style="cursor: zoom-in"
          />
          <div class="custom-media-content"></div>
        </div>
      </div>
    </div>

    <!-- الشقق -->
    <div class="container" id="app"></div>

    <script>
      let apartments = [
        {
          name: "شقه دور ثاني امام المول و الجامع , بجوار مدرسه البريطانيه",
          location: "ال77",
          price: "",
          type: "girls",
          images: [
            "https://res.cloudinary.com/dxqtdpjp0/video/upload/v1784618680/WhatsApp_Video_2026-07-21_at_6.46.35_AM_euggws.mp4",
          ],
        },
      ];
    </script>
    <!-- شباك الحجز (Modal) -->
    <div id="bookingModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 style="margin-bottom: 15px; color: #00e5ff">تأكيد الحجز 🏠</h2>
        <p
          id="apt-details-text"
          style="margin-bottom: 20px; font-size: 14px; color: #ddd"
        ></p>

        <form id="bookingForm" onsubmit="submitBooking(event)">
          <div class="form-group" style="margin-bottom: 15px">
            <input
              type="text"
              id="studentName"
              placeholder="الاسم ثلاثي"
              required
              class="modal-input"
            />
          </div>
          <div class="form-group" style="margin-bottom: 20px">
            <input
              type="tel"
              id="studentPhone"
              placeholder="رقم التليفون (واتساب)"
              required
              class="modal-input"
            />
          </div>
          <button type="submit" class="confirm-btn">تأكيد وإرسال الطلب</button>
        </form>
      </div>
    </div>
    <script src="main.js"></script>
    <script src="dark.js"></script>
  </body>
</html>
